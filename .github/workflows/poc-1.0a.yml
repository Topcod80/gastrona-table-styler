name: Test isolated POC 1.0A
on:
  push:
    branches: [poc-1.0-live-ar]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: poc-1.0a-tests
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/poc-1.0-live-ar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable refs and source isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse origin/main)" = 2d044013ae71992a82ffe72169ab90156b1287e8
          test "$(git rev-parse 'v0.4-stable^{commit}')" = 2d044013ae71992a82ffe72169ab90156b1287e8
          git diff --name-only v0.4-stable HEAD > /tmp/ar-files.txt
          python3 - <<'PY'
          from pathlib import Path
          names=Path('/tmp/ar-files.txt').read_text().splitlines()
          assert all(n.startswith('poc-1.0a/') or n=='.github/workflows/poc-1.0a.yml' for n in names), names
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33553271090" --jq '.conclusion' | grep -x success
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node poc-1.0a/build.cjs
      - run: pip install usd-core==26.5
      - run: python poc-1.0a/validate.py
      - run: npx playwright install --with-deps webkit
      - name: Test mobile preview and handoff
        run: |
          node poc-1.0a/serve.cjs > /tmp/plate-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node poc-1.0a/tests.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: poc-1.0a-build
          path: poc-1.0a/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-1.0a-pre-qa
          path: test-results/poc-1.0a/
